[project]
name = "risk-engine"
version = "0.1.0"
description = "Monte Carlo counterparty credit risk engine for Capitolis' ESF derivatives book"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
data = [
    "fredapi",
    "yfinance",
]
dev = [
    "pytest",
    "jupyter",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["risk_engine*", "capitolis_pricers*"]
